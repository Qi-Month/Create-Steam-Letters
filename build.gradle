plugins {
	id 'java-library'
	id 'maven-publish'
	id 'idea'
	id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
	archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// Separate client-only runtime mods from dedicated-server runs.
sourceSets {
	client
}

neoForge {
	version = project.neo_version

	parchment {
		mappingsVersion = project.parchment_mappings_version
		minecraftVersion = project.parchment_minecraft_version
	}

	runs {
		client {
			client()

			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		server {
			server()
			programArgument '--nogui'
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		gameTestServer {
			type = "gameTestServer"
			systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
		}

		data {
			data()
			programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
		}

		configureEach {
			systemProperty 'forge.logging.markers', 'REGISTRIES'

			logLevel = org.slf4j.event.Level.DEBUG
		}
	}

	mods {
		"${mod_id}" {
			sourceSet(sourceSets.main)
		}
	}
}

sourceSets.main.resources {
	srcDir 'src/generated/resources'
	exclude '.cache/**'
}

configurations {
	localRuntime {
		canBeConsumed = false
		canBeResolved = false
	}
	runtimeClasspath.extendsFrom localRuntime
}

repositories {
	mavenLocal()
	maven {
		name = "Create, Ponder, Flywheel"
		url = "https://maven.createmod.net"
	}
	maven {
		name = "Registrate"
		url = "https://maven.ithundxr.dev/snapshots"
	}
	maven {
		name = "CurseForge"
		url = "https://cursemaven.com"
	}
	maven {
		name = "ForgeConfigAPIPort"
		url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/"
	}
	maven {
		name = "Mod Maven"
		url = "https://modmaven.dev/"
	}
	maven {
		name = 'Latvian Mods (KubeJS, Rhino)'
		url = "https://maven.latvian.dev/releases"
		content {
			includeGroup "dev.latvian.mods"
			includeGroup "dev.latvian.apps"
		}
	}
	maven {
		url = "https://jitpack.io"
	}
	maven {
		name = "DVS1 Maven FS & TCon"
		url = "https://dvs1.progwml6.com/files/maven"
	}
}

dependencies {
	// Create
	implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
	implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
	compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
	runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
	implementation("com.tterrag.registrate:Registrate:${registrate_version}")

	// 柴油动力
	implementation("curse.maven:create-diesel-generators-869316:8542167")

	// CC&A
	implementation("curse.maven:createaddition-439890:9029800")

	// Jade
	implementation("curse.maven:jade-324717:8591319")

	// Configured
	runtimeOnly("curse.maven:configured-457570:7276577")

	// Jei
	compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
	compileOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
	runtimeOnly("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

	// KubeJS
	implementation("dev.latvian.mods:rhino:2101.2.8-build.91")
	implementation("dev.latvian.mods:kubejs-neoforge:2101.7.2-build.381")
	runtimeOnly("curse.maven:probejs-585406:8304356")

	// Mantel & Tinkers' Construct
	implementation files("libs/Mantle-1.21.1-1.13.1.jar")
	implementation files("libs/TinkersConstruct-1.21.1-3.13.2.jar")

	// Lomkok
	compileOnly("org.projectlombok:lombok:1.18.36")
	annotationProcessor("org.projectlombok:lombok:1.18.36")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
	var replaceProperties = [
			minecraft_version      : minecraft_version,
			minecraft_version_range: minecraft_version_range,
			neo_version            : neo_version,
			neo_version_range      : neo_version_range,
			loader_version_range   : loader_version_range,
			mod_id                 : mod_id,
			mod_name               : mod_name,
			mod_license            : mod_license,
			mod_version            : mod_version,
			mod_authors            : mod_authors,
			mod_description        : mod_description
	]
	inputs.properties replaceProperties
	expand replaceProperties
	from "src/main/templates"
	into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
	publications {
		register('mavenJava', MavenPublication) {
			from components.java
		}
	}
	repositories {
		maven {
			url "file://${project.projectDir}/repo"
		}
	}
}

tasks.named('jar', Jar).configure {
	// 输出 jar 名: Steam-Letters-<mod_version>-<minecraft_version>.jar
	archiveVersion = "${mod_version}-${minecraft_version}"

	manifest {
		attributes([
				'Specification-Title'     : mod_id,
				'Specification-Vendor'    : mod_authors,
				'Specification-Version'   : '1',
				'Implementation-Title'    : project.name,
				'Implementation-Version'  : project.jar.archiveVersion,
				'Implementation-Vendor'   : mod_authors,
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << "-parameters"
	options.compilerArgs << "-Xmaxerrs" << "2000"
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}
